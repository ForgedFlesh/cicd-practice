name: Python CI pipeline

on:
  
  pull_request:
    branches:
      - main

  push:
    branches:
      - main 
  
#Pull Request INTO main
#→ workflow runs

#Push TO main
#→ workflow runs

#Normal push to random feature branch
#→ workflow does NOT run


jobs:


  Python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        #this action is a reusuable task which can be used inside the workflow,it makes our repo available inside the runner ubuntu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          


      - name: Run automated test

        run: pytest

  terraform-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  build:
    needs:
      - Python-test
      - terraform-validation
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses : actions/checkout@v6

      - name: Create Deployment Package
        run: |
          mkdir deployment-package
          cp app.py deployment-package/
          cp requirements.txt deployment-package/

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deployment-package/


  deploy:
    needs:
      - build

    if: github.event_name== 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Download deployed artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-app
          path: deployment-package/

      - name: Show deployment files
        run: ls -la deployment-package

      - name: Show deployment enviroment
        run: echo "Deplpying to ${{ vars.DEPLOY_ENV }}"

      - name: Verify Secrets Exists
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

        run: |
          if [-z "$DEPLOY_TOKEN"]; then
            echo "credential is missing"
            exit 1
          fi

          echo "credential is available"
        

      - name: Simulate deployment
        run: echo "Deploying the validated artifact to production"



